name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它内部会调用已被移除的 `sdkmanager tools`，
      # 在较新的 runner 上会直接失败。改用 runner 自带的 SDK。
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Assemble debug + release
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify signature
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gunfire-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
